name: Publicar versión web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar el JAR
        run: mvn -B package -DskipTests

      - name: Compilar la versión para celular (Java -> JavaScript con TeaVM)
        run: mvn -B -f movil/pom.xml package

      - name: Preparar el sitio (escritorio + celular)
        run: |
          mkdir -p _site/movil
          cp web/index.html _site/
          cp target/RutasUPB.jar _site/
          cp movil/web/* movil/target/web/app.js _site/movil/
          cp src/main/resources/mapa_campus.jpg _site/movil/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
