name: Compilar y publicar

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn -B package

      - name: Compilar y probar la versión para celular
        run: mvn -B -f movil/pom.xml package

      - name: Guardar el JAR
        uses: actions/upload-artifact@v4
        with:
          name: RutasUPB
          path: target/RutasUPB.jar

      # Al crear un tag (por ejemplo v1.0) se publica una Release con el JAR descargable
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/RutasUPB.jar
